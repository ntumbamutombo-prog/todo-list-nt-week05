<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app">
        <h1>To-Do List</h1>

        <div class="input-row">
            <input type="text" id="task-input" placeholder="What needs doing?">
            <button id="add-btn">Add</button>
        </div>

        <h2 id="pending-count">Pending: 0</h2>
        <ul id="pending-list"></ul>

        <h2 id="completed-count">Completed: 0</h2>
        <ul id="completed-list"></ul>

        <button id="reset-btn">Clear All</button>

    </div>

    <script src="motion.js"></script>

</body>

</html>
